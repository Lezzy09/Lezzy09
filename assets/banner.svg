<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="0.55" stop-color="#151036"/>
      <stop offset="1" stop-color="#22093a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .blob { animation: drift 9s ease-in-out infinite alternate; }
      .blob2 { animation: drift2 11s ease-in-out infinite alternate; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes drift  { from { transform: translate(0,0) } to { transform: translate(60px,25px) } }
      @keyframes drift2 { from { transform: translate(0,0) } to { transform: translate(-70px,-20px) } }
      @keyframes blink  { 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="blob" cx="930" cy="80" r="260" fill="url(#glowA)"/>
    <circle class="blob2" cx="160" cy="260" r="230" fill="url(#glowB)"/>

    <!-- duck mark -->
    <g transform="translate(980 150)" opacity="0.9">
      <circle r="78" fill="none" stroke="url(#title)" stroke-width="2" stroke-dasharray="4 10" opacity="0.6"/>
      <path d="M-30 18c0-26 18-44 40-44 18 0 30 12 30 28 0 6-2 11-5 15h17c-2 22-24 37-52 37-18 0-30-14-30-36z" fill="#fde047"/>
      <path d="M38 -3l22 6-22 7z" fill="#fb923c"/>
      <circle cx="18" cy="-6" r="5" fill="#0b0f1e"/>
    </g>

    <text x="70" y="128" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" fill="url(#title)">Lezzy</text>
    <text x="72" y="172" font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="22" fill="#cbd5e1">&gt; building tools for UEFN creators<tspan class="cursor" fill="#5eead4">_</tspan></text>

    <g font-family="'Cascadia Code', Consolas, 'SFMono-Regular', monospace" font-size="15" fill="#e2e8f0">
      <g transform="translate(72 208)"><rect width="128" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#5eead4" stroke-opacity="0.5"/><text x="64" y="22" text-anchor="middle">UEFN · Verse</text></g>
      <g transform="translate(212 208)"><rect width="148" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/><text x="74" y="22" text-anchor="middle">Ducky plugins</text></g>
      <g transform="translate(372 208)"><rect width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#f472b6" stroke-opacity="0.5"/><text x="59" y="22" text-anchor="middle">AI agents</text></g>
      <g transform="translate(502 208)"><rect width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#fde047" stroke-opacity="0.5"/><text x="44" y="22" text-anchor="middle">Python</text></g>
    </g>
  </g>
</svg>
